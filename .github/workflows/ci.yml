# .github/workflows/ci.yml
#
# Continuous Integration - runs on GitHub's machines on every push / PR that
# touches the backend:
#   lint (ESLint) → typecheck (tsc) → tests (Jest: real Express app,
#   in-memory MongoDB replica set, real Redis)
# A red ❌ means something broke; the run shows which step and which test.
#
# Frontend has its own job later (owned by the frontend session).

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'beyownd-backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'beyownd-backend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: beyownd-backend

    # Same Redis the tests use locally (docker start beyownd-redis)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # mongodb-memory-server downloads a MongoDB binary (~100 MB on Linux).
      # Keep it outside node_modules so the cache below can reuse it.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: beyownd-backend/package-lock.json

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('beyownd-backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (Jest)
        run: npm test -- --ci
